<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN Admin - Gestión de Préstamos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .utn-blue { background-color: #00447c; }
        .utn-text { color: #00447c; }
        .status-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
        .status-pending { background-color: #fef3c7; color: #d97706; }
        .status-rejected { background-color: #fee2e2; color: #dc2626; }
        .status-approved { background-color: #d1fae5; color: #059669; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-20">

    <!-- Header Admin -->
    <header class="utn-blue p-4 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00447c" stroke-width="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h1 class="font-black text-sm tracking-tighter uppercase">Panel de Control <span class="font-light opacity-70">| Admin</span></h1>
            </div>
            <button onclick="location.reload()" class="bg-blue-700/50 p-2 rounded-full hover:bg-blue-600 transition">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        
        <!-- Resumen Rápido -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Pendientes</p>
                <p class="text-xl font-black utn-text" id="count-pending">2</p>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Hoy</p>
                <p class="text-xl font-black text-emerald-600">14</p>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Rechazos</p>
                <p class="text-xl font-black text-rose-600" id="count-rejected">0</p>
            </div>
        </div>

        <!-- Filtro de Búsqueda -->
        <div class="relative">
            <input type="text" placeholder="Buscar por carnet o nombre..." class="w-full p-4 pl-12 bg-white rounded-2xl border border-slate-200 shadow-sm focus:ring-2 ring-blue-500 outline-none text-sm transition-all">
            <svg class="absolute left-4 top-4 text-slate-400" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>

        <!-- Lista de Solicitudes -->
        <div class="space-y-4" id="solicitudes-list">
            <!-- Los elementos se cargan con JS para simular dinamismo -->
        </div>

    </main>

    <!-- MODAL RECHAZO (RAZÓN) -->
    <div id="modalReject" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl animate-in">
            <div class="w-16 h-16 bg-rose-100 rounded-2xl flex items-center justify-center mb-6">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <h3 class="text-xl font-black text-slate-800 mb-2">Rechazar Solicitud</h3>
            <p class="text-slate-500 text-sm mb-6">Por favor, indica el motivo para notificar al estudiante.</p>
            
            <div class="space-y-3 mb-8">
                <button onclick="confirmReject('Material no disponible')" class="w-full p-4 text-left border border-slate-100 bg-slate-50 rounded-2xl text-xs font-bold text-slate-600 hover:border-blue-200 hover:bg-blue-50 transition">Material no disponible</button>
                <button onclick="confirmReject('Sanción administrativa activa')" class="w-full p-4 text-left border border-slate-100 bg-slate-50 rounded-2xl text-xs font-bold text-slate-600 hover:border-blue-200 hover:bg-blue-50 transition">Sanción administrativa activa</button>
                <button onclick="confirmReject('Horario de laboratorio cerrado')" class="w-full p-4 text-left border border-slate-100 bg-slate-50 rounded-2xl text-xs font-bold text-slate-600 hover:border-blue-200 hover:bg-blue-50 transition">Horario de laboratorio cerrado</button>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-[10px] font-bold uppercase tracking-widest shadow-2xl opacity-0 transition-all z-[110]"></div>

    <script>
        let currentId = null;
        let rejectedCount = 0;

        const data = [
            { id: '8349-UTN', user: 'Matías Smith Lean', carnet: '956783049', item: 'Multímetro Digital', code: 'AUD-424', status: 'pending' },
            { id: '8449-UTN', user: 'Mora Pérez Lucía', carnet: '688378909', item: 'Osciloscopio TDS', code: 'AUD-210', status: 'pending' }
        ];

        function render() {
            const list = document.getElementById('solicitudes-list');
            list.innerHTML = '';

            data.forEach(sol => {
                const div = document.createElement('div');
                div.className = `bg-white rounded-3xl border border-slate-200 p-6 shadow-sm animate-in relative overflow-hidden transition-all ${sol.status !== 'pending' ? 'opacity-60 scale-[0.98]' : ''}`;
                
                let actions = `
                    <div class="grid grid-cols-2 gap-3 mt-6">
                        <button onclick="openReject('${sol.id}')" class="py-3 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black uppercase hover:bg-rose-100 hover:text-rose-600 transition-all">Rechazar</button>
                        <button onclick="approve('${sol.id}')" class="py-3 bg-emerald-600 text-white rounded-xl text-[10px] font-black uppercase shadow-lg shadow-emerald-100 hover:bg-emerald-700 transition-all">Aprobar</button>
                    </div>
                `;

                if(sol.status === 'approved') {
                    actions = `<div class="mt-6 p-3 bg-emerald-50 text-emerald-600 rounded-xl text-center text-[10px] font-black uppercase tracking-widest border border-emerald-100">✔ Solicitud Autorizada</div>`;
                } else if(sol.status === 'rejected') {
                    actions = `<div class="mt-6 p-3 bg-rose-50 text-rose-600 rounded-xl text-center text-[10px] font-black uppercase tracking-widest border border-rose-100 flex flex-col items-center">
                        <span>✖ Rechazada</span>
                        <span class="text-[8px] font-medium opacity-70 mt-1">${sol.reason}</span>
                    </div>`;
                }

                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="status-badge status-${sol.status}">${sol.status === 'pending' ? 'Pendiente' : (sol.status === 'approved' ? 'Aprobada' : 'Rechazada')}</span>
                            <h3 class="font-black text-slate-800 mt-2 text-lg leading-tight uppercase tracking-tighter">${sol.user}</h3>
                            <p class="text-xs font-bold text-blue-600">Carnet: ${sol.carnet}</p>
                        </div>
                        <p class="text-[9px] font-black text-slate-300 uppercase">Boleta ${sol.id}</p>
                    </div>
                    
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Material</span>
                            <span class="text-[9px] font-black utn-text bg-blue-50 px-2 py-0.5 rounded">${sol.code}</span>
                        </div>
                        <p class="text-sm font-black text-slate-700">${sol.item}</p>
                    </div>

                    ${actions}
                `;
                list.appendChild(div);
            });

            document.getElementById('count-pending').innerText = data.filter(s => s.status === 'pending').length;
            document.getElementById('count-rejected').innerText = rejectedCount;
        }

        function approve(id) {
            const index = data.findIndex(s => s.id === id);
            data[index].status = 'approved';
            showToast("Boleta autorizada correctamente");
            render();
        }

        function openReject(id) {
            currentId = id;
            document.getElementById('modalReject').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalReject').classList.add('hidden');
        }

        function confirmReject(reason) {
            const index = data.findIndex(s => s.id === currentId);
            data[index].status = 'rejected';
            data[index].reason = reason;
            rejectedCount++;
            closeModal();
            showToast("Solicitud rechazada y archivada");
            render();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-5');
            t.classList.add('opacity-100', '-translate-y-5');
            setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-5');
                t.classList.remove('opacity-100', '-translate-y-5');
            }, 3000);
        }

        // Inicializar
        render();
    </script>
</body>
</html>
