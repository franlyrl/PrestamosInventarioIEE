version: '3.8'

services:
  # Base de datos MongoDB
  mongodb:
    image: docker.io/mongo:6.0
    container_name: prestamos_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: prestamos_lab
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prestamos_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/prestamos_lab?authSource=admin
      JWT_SECRET: tu_secreto_jwt_aqui
      DB_NAME: prestamos_lab
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prestamos_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_API_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:
