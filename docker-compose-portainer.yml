version: '3.8'

services:
  # Portainer - Interfaz web para Docker
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - prestamos_network

  # Base de datos MongoDB
  mongodb:
    image: mongo:6.0
    container_name: prestamos_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: prestamos_lab
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - prestamos_network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prestamos_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/prestamos_lab?authSource=admin
      JWT_SECRET: tu_secreto_jwt_aqui
      DB_NAME: prestamos_lab
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - prestamos_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prestamos_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://0.0.0.0:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - prestamos_network

volumes:
  mongodb_data:
  portainer_data:

networks:
  prestamos_network:
    driver: bridge
