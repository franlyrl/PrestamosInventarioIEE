<!-- Carrito de Solicitudes (Componente Compartido) -->
<div id="cartModal" class="modal-overlay" onclick="if(event.target===this)closeCartModal()">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col border border-slate-200">
        <!-- Header del modal (Azul Institucional) -->
        <div class="bg-gradient-to-r from-[#002D62] to-[#004daa] p-5 text-white flex items-center justify-between flex-shrink-0 border-b-4 border-[#F2A900]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-[#F2A900]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-black tracking-tight">Carrito de Solicitudes</h3>
                    <p class="text-blue-100/70 text-[10px] font-bold uppercase tracking-widest mt-0.5">Gestión de Préstamos</p>
                </div>
            </div>
            <button onclick="closeCartModal()" class="w-8 h-8 bg-white/10 hover:bg-red-500/80 rounded-lg flex items-center justify-center transition-all group">
                <svg class="w-4 h-4 text-white group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Contenido scrolleable -->
        <div class="overflow-y-auto flex-1 p-5 bg-slate-50/50">
            <!-- Lista de items -->
            <div id="cartItems" class="space-y-3 mb-6 min-h-[100px]">
                <div class="py-10 text-center">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                        </svg>
                    </div>
                    <p class="text-slate-400 text-sm font-medium">El carrito está vacío</p>
                </div>
            </div>

            <!-- Resumen -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-5">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total de artículos</p>
                        <p class="text-xs text-slate-500">Revisados y listos</p>
                    </div>
                    <span id="cartTotal" class="text-3xl font-black text-[#002D62]">0</span>
                </div>
            </div>

            <!-- Formulario de solicitud -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-1 h-3 bg-[#F2A900] rounded-full"></span>
                    <p class="text-[10px] font-black text-slate-800 uppercase tracking-widest">Información Requerida</p>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-1.5 ml-1">
                        Motivo del préstamo <span class="text-red-500">*</span>
                    </label>
                    <input id="solicitud-motivo" type="text" 
                        placeholder="Ej: Laboratorio de Electrónica III"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-[#F2A900]/20 focus:border-[#F2A900] transition-all outline-none">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-1.5 ml-1">
                        Comentarios adicionales
                    </label>
                    <textarea id="solicitud-observaciones" rows="2" 
                        placeholder="Detalles sobre el uso o entrega..."
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-[#F2A900]/20 focus:border-[#F2A900] transition-all outline-none resize-none"></textarea>
                </div>
            </div>
        </div>

        <!-- Footer del modal (Acciones con DISEÑO ORO) -->
        <div class="p-5 border-t border-slate-100 bg-white flex gap-3 flex-shrink-0">
            <button onclick="clearCart()" 
                class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-bold text-sm transition-all active:scale-95">
                Vaciar
            </button>
            <button onclick="sendRequest()" 
                class="flex-[2] py-3.5 bg-[#F2A900] hover:bg-[#e09b00] text-[#002D62] rounded-2xl font-black text-sm transition-all shadow-lg shadow-[#F2A900]/20 active:scale-95 flex items-center justify-center gap-2 uppercase tracking-widest">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                Enviar Solicitud
            </button>
        </div>
    </div>
</div>
