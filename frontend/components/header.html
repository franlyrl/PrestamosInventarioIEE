<!-- Header Component -->
<header class="bg-gradient-to-r from-[#002e6e] via-[#004a8c] to-[#0066cc] text-white shadow-xl border-b border-[#004a8c]/20">
    <div class="container">
        <div class="flex justify-between items-center py-4">
            <!-- Logo y Branding -->
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-white rounded-lg shadow-lg flex items-center justify-center transform hover:scale-105 transition-transform overflow-hidden">
                    <img src="../css/UTN.jpg" alt="UTN Logo" class="w-8 h-8 object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">SPIEE-SP</h1>
                    <p class="text-xs font-medium" style="color: #f78b08;">Sistema de Prestamos y Inventario de Equipo Electrico y Electronico</p>
                </div>
            </div>
            
            <!-- Info de Usuario y Acciones -->
            <div class="flex items-center gap-4">
                <!-- Carrito de Solicitudes -->
                <div class="relative">
                    <button id="cartBtn" class="bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/20 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2 hover:scale-105">
                        🛒 Solicitudes
                        <span id="cartCount" class="bg-white text-xs px-2 py-0.5 rounded-full font-bold" style="color: #002e6e;">0</span>
                    </button>
                </div>
                
                <!-- Info Usuario -->
                <div class="text-right hidden md:block">
                    <p class="text-sm font-semibold text-white" id="userInfo">Usuario</p>
                    <p class="text-xs flex items-center gap-1" id="currentDateTime" style="color: #f78b08;">
                        <span class="w-2 h-2 rounded-full animate-pulse" style="background-color: #f78b08;"></span>
                        Conectado
                    </p>
                </div>
                
                <!-- Menú Usuario -->
                <div class="relative">
                    <button id="user-menu-btn" class="bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/20 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2 hover:scale-105">
                        <div class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center">
                            👤
                        </div>
                        <span id="userMenuName">Usuario</span>
                        <svg class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    
                    <!-- Dropdown Menu Mejorado -->
                    <div id="user-dropdown" class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-50 transform transition-all duration-200">
                        <!-- Header del Dropdown -->
                        <div class="bg-gradient-to-r from-[#004a8c] to-[#0066cc] p-4 text-white">
                            <p class="text-sm font-semibold" id="dropdownUserName">Usuario</p>
                            <p class="text-xs" id="dropdownUserRole">Cargando rol...</p>
                        </div>
                        
                        <!-- Opciones del Menú -->
                        <div class="py-2">
                            <a href="/" class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: #f0f8ff;">
                                    <span style="color: #004a8c;">🏠</span>
                                </div>
                                <div>
                                    <p class="font-medium">Inicio</p>
                                    <p class="text-xs text-slate-500">Página principal</p>
                                </div>
                            </a>
                            
                            <a href="/pages/perfil.html" class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: #f0f8ff;">
                                    <span style="color: #004a8c;">👤</span>
                                </div>
                                <div>
                                    <p class="font-medium">Mi Perfil</p>
                                    <p class="text-xs text-slate-500">Gestionar cuenta</p>
                                </div>
                            </a>
                            
                            <a href="/pages/reportes.html" class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: #f0f8ff;">
                                    <span style="color: #004a8c;">📊</span>
                                </div>
                                <div>
                                    <p class="font-medium">Reportes</p>
                                    <p class="text-xs text-slate-500">Ver estadísticas</p>
                                </div>
                            </a>
                            
                            <a href="/pages/solicitudes.html" class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: #f0f8ff;">
                                    <span style="color: #004a8c;">📋</span>
                                </div>
                                <div>
                                    <p class="font-medium">Mis Solicitudes</p>
                                    <p class="text-xs text-slate-500">Historial completo</p>
                                </div>
                            </a>
                        </div>
                        
                        <!-- Separador -->
                        <div class="border-t border-slate-200"></div>
                        
                        <!-- Cerrar Sesión -->
                        <button id="logoutBtn" class="flex items-center gap-3 w-full px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-red-100">
                                <span style="color: #dc2626;">🚪</span>
                            </div>
                            <div class="text-left">
                                <p class="font-medium">Cerrar Sesión</p>
                                <p class="text-xs text-slate-500">Salir del sistema</p>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
// NO ejecutar updateUserInfo automáticamente aquí
// La función se ejecutará desde la página que carga el header (como en perfil.html)

// Función updateUserInfo disponible para que las páginas la llamen
function updateUserInfo() {
    console.log('👤 updateUserInfo() llamada desde header...');
    
    // Obtener currentUser de localStorage
    const userData = localStorage.getItem('utn_user');
    const currentUser = userData ? JSON.parse(userData) : null;
    
    console.log('👤 currentUser en updateUserInfo():', currentUser);
    
    if (currentUser) {
        const userInfo = document.getElementById('userInfo');
        const userMenuName = document.getElementById('userMenuName');
        const dropdownUserName = document.getElementById('dropdownUserName');
        const dropdownUserRole = document.getElementById('dropdownUserRole');
        const cartBtn = document.getElementById('cartBtn');
        
        // Obtener el rol del usuario
        const userRole = currentUser.rol || currentUser.rol_nombre || currentUser.tipo_rol || 'Estudiante';
        console.log('🔍 Rol del usuario:', userRole);
        
        // Ocultar carrito solo para administradores
        if (cartBtn) {
            if (userRole === 'admin' || userRole === 'administrador') {
                cartBtn.style.display = 'none';
                console.log('🛒 Carrito oculto para administrador');
            } else {
                cartBtn.style.display = 'flex';
                console.log('🛒 Carrito visible para estudiante/docente');
            }
        }
        
        // Usar el campo correcto de la base de datos (colección usuarios)
        const nombreCompleto = currentUser.nombre_completo || currentUser.nombre || 'Usuario';
        
        if (userInfo) {
            userInfo.textContent = nombreCompleto;
            console.log('✅ userInfo actualizado:', nombreCompleto);
        }
        
        if (userMenuName) {
            userMenuName.textContent = nombreCompleto;
            console.log('✅ userMenuName actualizado:', nombreCompleto);
        }
        
        if (dropdownUserName) {
            dropdownUserName.textContent = nombreCompleto;
            console.log('✅ dropdownUserName actualizado:', nombreCompleto);
        }
        
        if (dropdownUserRole) {
            dropdownUserRole.textContent = userRole;
            console.log('✅ dropdownUserRole actualizado:', userRole);
        }
    } else {
        console.log('❌ No hay currentUser para actualizar');
    }
}

console.log(' Header cargado - updateUserInfo() disponible para ser llamada desde la página');

// Llamar automáticamente a updateUserInfo cuando se carga el header
document.addEventListener('DOMContentLoaded', () => {
    console.log(' Header DOM cargado, llamando a updateUserInfo()...');
    updateUserInfo();
});
</script>
