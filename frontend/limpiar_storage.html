<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Storage</title>

    <!-- SweetAlert2 --><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Limpiando localStorage...</h1>
    <script>
        // Limpiar completamente el localStorage
        localStorage.clear();
        
        // Establecer valores de prueba para verificar
        localStorage.setItem('test_limpieza', 'completado');
        
        // Verificar que se limpió
        console.log(' localStorage limpiado');
        console.log(' Contenido actual:', localStorage);
        
        // Redirigir al login
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2000);
    </script>
</body>
</html>
