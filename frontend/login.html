    <script>
      // Silenciar alerta de Tailwind CDN para evitar ruido en consola
      const originalWarn = console.warn;
      console.warn = function() {
        if (arguments[0] && arguments[0].includes('cdn.tailwindcss.com should not be used in production')) return;
        originalWarn.apply(console, arguments);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {

                extend: {

    <style>
      .swal2-popup.swal-boleta-popup {
        font-family: 'Inter', sans-serif !important;
        border-radius: 20px !important;
        border: 1px solid #c8dbf5 !important;
        background:
          radial-gradient(circle at 0% 0%, rgba(0, 45, 98, 0.06), transparent 40%),
          radial-gradient(circle at 100% 100%, rgba(242, 169, 0, 0.08), transparent 38%),
          #ffffff !important;
        box-shadow: 0 26px 60px rgba(2, 32, 71, 0.24) !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
      .swal-boleta-popup .swal2-html-container { margin: 0 !important; padding: 0 !important; }
      .swal-boleta-wrap { text-align:left; }
      .swal-boleta-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        background: linear-gradient(120deg, #002d62 0%, #0b4a98 100%);
        border-bottom: 3px solid #f2a900;
      }
      .swal-boleta-header .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .swal-boleta-header .icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .swal-boleta-header h3 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: .01em;
        color: #fff;
        line-height: 1.15;
      }
      .swal-boleta-header p {
        margin: 4px 0 0 0;
        color: #dbeafe;
        font-size: 11px;
        font-weight: 600;
      }
      .swal-boleta-body {
        padding: 16px 20px 6px;
      }
      .swal-boleta-actions {
        padding: 10px 20px 18px;
      }
      .swal-boleta-popup .swal2-input {
        border-radius: 12px !important;
        border: 1.5px solid #dbe3ef !important;
        background: #f8fafc !important;
      }
      .swal-boleta-popup .swal2-input:focus {
        border-color: #002d62 !important;
        box-shadow: 0 0 0 3px rgba(0, 45, 98, 0.1) !important;
      }
      .swal-boleta-popup .swal2-confirm.swal-boleta-confirm {
        border-radius: 11px !important;
        background: linear-gradient(120deg, #002d62 0%, #0b4a98 100%) !important;
        font-weight: 800 !important;
        letter-spacing: .03em !important;
        padding: 0.72rem 1rem !important;
        box-shadow: 0 10px 20px rgba(0,45,98,.22) !important;
      }
      .swal-boleta-popup .swal2-cancel.swal-boleta-cancel {
        border-radius: 11px !important;
        background: #eef4ff !important;
        color: #375372 !important;
        border: 1px solid #cfe0f8 !important;
        font-weight: 800 !important;
        padding: 0.67rem 1rem !important;
      }
      .swal2-close.swal-boleta-close {
        color: #dbeafe !important;
        font-size: 28px !important;
        font-weight: 300 !important;
      }
      .swal-boleta-note {
        background: linear-gradient(120deg,#eef4ff,#f8fbff);
        border: 1px solid #dbe7f7;
        border-radius: 14px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .swal-boleta-drop {
        border:1.5px dashed #bfd2ef;
        background:#f8fbff;
        border-radius:12px;
        padding:10px 12px;
      }
      .swal-file-uploader {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 9px;
        align-items: center;
      }
      .swal-file-btn {
        background: #eef4ff;
        border: 1px solid #cfe0f8;
        color: #27496d;
        border-radius: 10px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .02em;
        cursor: pointer;
      }
      .swal-file-name {
        min-height: 36px;
        border: 1px solid #d7e3f3;
        border-radius: 10px;
        background: #fff;
        color: #64748b;
        font-size: 13px;
        padding: 8px 11px;
        display: flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  
    <!-- SweetAlert2 --><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
  <body class="text-slate-800 bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans">
    <!-- PANTALLA DE LOGIN SPLIT-SCREEN FULLSCREEN -->
    <div id="loginPage" class="flex min-h-screen w-full overflow-hidden bg-white fade-in relative z-10">
      
        <!-- Panel Lateral Izquierdo (Branding Institucional) -->
        <div class="hidden lg:flex flex-col justify-center items-center w-[40%] xl:w-[45%] bg-utn-blue text-white p-12 relative overflow-hidden shadow-[10px_0_30px_rgba(0,0,0,0.1)] z-20">
            <!-- Decorative elements -->
            <div class="absolute top-0 right-0 -mt-20 -mr-20 w-64 h-64 bg-utn-gold opacity-10 rounded-full blur-3xl z-0 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-80 h-80 bg-white opacity-5 rounded-full blur-3xl z-0 pointer-events-none"></div>
            
            <div class="bg-white p-4 rounded-full mb-8 shadow-2xl z-10 transform hover:scale-105 transition-transform duration-500">
                <img src="css/UTN.jpg" alt="UTN Logo" class="w-24 h-24 object-contain">
            </div>
            
            <h2 class="text-3xl xl:text-4xl font-bold text-center z-10 leading-tight mb-2">Sistema de Electrónica</h2>
            <div class="w-16 h-1.5 bg-utn-gold my-6 z-10 rounded-full"></div>
            <p class="text-blue-100 text-lg text-center font-medium z-10 max-w-md">Control Institucional de Activos e Insumos Universitarios</p>
            
            <div class="absolute bottom-10 z-10 text-xs text-blue-300/80 font-bold tracking-widest uppercase">
                Universidad Técnica Nacional
            </div>
        </div>

        <!-- Panel Derecho (Formulario de Acceso) -->
        <div class="w-full lg:w-[60%] xl:w-[55%] flex flex-col justify-center px-8 sm:px-16 md:px-24 xl:px-32 py-12 relative h-full min-h-screen overflow-y-auto">
            
            <div class="w-full max-w-lg mx-auto">
                <div class="mb-10 text-left">
                    <h3 class="text-4xl font-extrabold text-utn-blue mb-3 tracking-tight">Iniciar Sesión</h3>
                    <p class="text-slate-500 text-base font-medium">Ingrese sus credenciales universitarias</p>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Correo Institucional</label>
                        <input type="text" id="userInput" placeholder="estudiante@utn.ac.cr" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-base text-slate-800 font-medium" required />
                    </div>
                    
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                        <input type="password" id="passInput" placeholder="••••••••" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-base text-slate-800 font-medium" required />
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="loginBtn" class="w-full bg-utn-blue hover:bg-utn-dark text-white py-4 rounded-xl font-bold text-sm tracking-widest uppercase shadow-lg shadow-utn-blue/20 active:scale-[0.98] transition-all flex justify-center items-center gap-3">
                            <span>Acceder al Sistema</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                    
                    <div class="pt-8 mt-8 border-t border-slate-100 flex flex-col items-center">
                        <p class="text-sm text-slate-500 font-medium mb-3">¿Aún no tiene un usuario?</p>
                        <button type="button" onclick="goToSignUp()" class="text-utn-blue font-bold text-sm hover:text-utn-gold transition-colors bg-transparent border-b-2 border-transparent hover:border-utn-gold pb-1 px-1">
                            Crear Cuenta Nueva
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="lg:hidden text-center mt-12 mb-4 text-xs text-slate-400 font-bold tracking-widest uppercase">
                Universidad Técnica Nacional
            </div>
        </div>

    </div>

    <!-- INDICADOR DE CONEXI-N -->
    <div
      id="connectionStatus"
      class="fixed top-4 right-4 z-[300] flex items-center gap-2 bg-white px-3 py-2 rounded-full shadow-md border border-slate-200 text-xs">
      <div
        id="dbIndicator"
        class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
      <span id="dbStatus">Verificando conexión...</span>
    </div>

    <!-- TOAST DE NOTIFICACIONES -->
    <div
      id="toast"
      class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none z-[200]">
      <div
        class="bg-slate-900 text-white text-[10px] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 uppercase tracking-widest font-bold">
        <span id="toastMsg">Operación Exitosa</span>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      // Configuración global - usa ruta relativa para funcionar con Caddy/ngrok
      const CONFIG = {
        API_BASE_URL: '/api',
        DB_STATUS_CHECK_INTERVAL: 30000 // 30 segundos
      };
      // Estado de conexión
      let dbConnected = false;
      let connectionCheckInterval;

      // Función para mostrar notificaciones
      function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        
        toastMsg.textContent = message;
        toast.classList.remove('translate-y-20', 'opacity-0');
        
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
      }

      // Función para verificar conexión a la base de datos
        async function checkDBConnection() {
            const indicator = document.getElementById('dbIndicator');
            const status = document.getElementById('dbStatus');
            
            try {
                // Verificar si el servidor está corriendo (endpoint público)
                const response = await fetch(`${window.CONFIG?.API_BASE_URL || '/api'}/usuarios/login`, {
                    method: 'OPTIONS',
                    timeout: 5000
                });
                
                // Si el servidor responde, asumimos que la BD está conectada
                indicator.classList.remove('bg-yellow-500', 'bg-red-500', 'animate-pulse');
                indicator.classList.add('bg-green-500');
                status.textContent = 'Conectado a MongoDB';
                dbConnected = true;
                
            } catch (error) {
                indicator.classList.remove('bg-yellow-500', 'bg-green-500', 'animate-pulse');
                indicator.classList.add('bg-red-500');
                status.textContent = 'Sin conexión a BD';
                dbConnected = false;
            }
        }

      // Función de login
      async function handleLogin(credentials) {
        try {
          const loginBtn = document.querySelector('button[type="submit"]');
          loginBtn.disabled = true;
          loginBtn.textContent = 'Verificando credenciales...';

          let correoElectronico = credentials.correo_electronico;
          if (/^\d{9,12}$/.test(correoElectronico)) {
            correoElectronico = `${correoElectronico}@utn.ac.cr`;
          }

          const loginData = {
            correo_electronico: correoElectronico.toLowerCase().trim(),
            contrasena: credentials.contrasena
          };


          // Usar la ruta correcta del backend
          const response = await fetch(`${window.CONFIG?.API_BASE_URL || '/api'}/usuarios/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(loginData)
          });

          
          const data = await response.json();

          if (!response.ok) {
            console.error(' Respuesta no OK:', response.status, response.statusText);
            console.error(' Datos de error:', data);
            
            // Verificar si es docente esperando aprobación
            if (response.status === 403 && data.esperando_aprobacion) {
              loginBtn.disabled = false;
              loginBtn.textContent = 'ACCEDER AL SISTEMA';
              if (window.Swal) {
                await Swal.fire({
                  icon: 'info',
                  iconColor: '#f59e0b',
                  title: 'Cuenta en espera de aprobación',
                  html: `
                    <div class="py-4 text-left">
                      <p class="text-sm text-slate-700 mb-3">Tu cuenta de docente está <strong class="text-[#002D62]">pendiente de aprobación</strong> por parte del administrador.</p>
                      <p class="text-xs text-slate-600 mb-4">No podrás acceder al sistema hasta que el administrador active tu cuenta.</p>
                      <div class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <p class="text-xs font-semibold text-blue-800 uppercase mb-2">Qué debes hacer</p>
                        <ul class="text-xs text-slate-700 space-y-2">
                          <li>• Espera a que el administrador revise y apruebe tu cuenta.</li>
                          <li>• Recibirás una notificación cuando tu cuenta sea activada.</li>
                          <li>• Si tienes urgencia, contacta al administrador.</li>
                        </ul>
                      </div>
                      <div class="mt-4 text-center">
                        <a href="mailto:hari@utn.ac.cr?subject=Solicitud%20de%20aprobación%20de%20cuenta%20docente&body=Hola%20Hari,%0A%0ASolicito%20la%20aprobación%20de%20mi%20cuenta%20de%20docente%20para%20acceder%20al%20sistema%20SPIEE.%0A%0AGracias." 
                           class="inline-block px-4 py-2 bg-[#002D62] text-white text-xs font-bold rounded-lg hover:bg-[#003d82] transition-colors">
                          Contactar Administrador
                        </a>
                      </div>
                    </div>`,
                  confirmButtonText: 'Entendido',
                  confirmButtonColor: '#002D62',
                  allowOutsideClick: false,
                  allowEscapeKey: false,
                  customClass: {
                    popup: 'rounded-3xl',
                    confirmButton: 'font-black px-6 py-3 rounded-xl bg-[#002D62] border border-[#002D62] text-white hover:bg-[#003d82]'
                  }
                });
              }
              return;
            }
            
            if (response.status === 403 && data.requiere_boleta) {
              await abrirModalReactivacionBoleta(correoElectronico, data.cuatrimestre || '');
              return;
            }
            throw new Error(data.message || 'Error de autenticación');
          }

          // Guardar en localStorage
          localStorage.setItem('utn_token', data.token);
          localStorage.setItem('utn_user', JSON.stringify(data.usuario));

          
          //  VERIFICAR SI ES DOCENTE PENDIENTE DE APROBACIÓN
          
          const tipoRol = data.usuario.tipo_rol || data.usuario.rol || '';
          const estadoUsuario = data.usuario.estado_usuario || '';
          
          if (tipoRol === 'docente' && estadoUsuario === 'inactivo') {
              // Mostrar modal bloqueante para docentes no aprobados
              if (window.Swal) {
                  await Swal.fire({
                      icon: 'info',
                      title: 'Cuenta en espera de aprobación',
                      html: `
                          <div class="py-4 text-left">
                              <p class="text-sm text-slate-700 mb-3">Hola <strong>${data.usuario.nombre_completo || 'Docente'}</strong>,</p>
                              <p class="text-sm text-slate-700 mb-3">Tu cuenta está <strong class="text-blue-700">pendiente de aprobación</strong> por parte del administrador.</p>
                              <p class="text-xs text-slate-600 mb-4">Mientras tu cuenta no sea aprobada, no podrás acceder a las funcionalidades del sistema.</p>
                              <div class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                  <p class="text-xs font-semibold text-blue-800 uppercase mb-2">Qué debes hacer</p>
                                  <ul class="text-xs text-slate-700 space-y-2">
                                      <li>• Espera a que el administrador revise y apruebe tu cuenta.</li>
                                      <li>• Recibirás una notificación cuando tu cuenta sea activada.</li>
                                      <li>• Si tienes urgencia, contacta al administrador.</li>
                                  </ul>
                              </div>
                          </div>`,
                      confirmButtonText: 'Entendido',
                      confirmButtonColor: '#002D62',
                      allowOutsideClick: false,
                      allowEscapeKey: false,
                      backdrop: true,
                      customClass: {
                          popup: 'rounded-3xl',
                          confirmButton: 'font-black px-6 py-3 rounded-xl bg-[#002D62] border border-[#002D62] text-white'
                      },
                      didOpen: () => {
                          const closeBtn = document.querySelector('.swal2-close');
                          if (closeBtn) closeBtn.style.display = 'none';
                      }
                  });
                  // Limpiar localStorage y no redirigir
                  localStorage.clear();
                  sessionStorage.clear();
                  // Recargar la página de login
                  window.location.reload();
              }
              return; // NO redirigir - quedarse en login
          }
          
          //  EXTRAER ROL ANTES DEL TIMEOUT
          const rol = data.usuario.rol ? data.usuario.rol.toLowerCase() : '';
          
          // Determinar destino ANTES del timeout
          let destino = '';
          if (rol.includes('administrador') || rol.includes('admin')) {
              destino = 'pages/ModAdmis.html';
          } else {
              destino = 'pages/ModUsuarios.html';
          }
          
          
          // Verificar que se guardaron correctamente
          const tokenGuardado = localStorage.getItem('utn_token');
          const userGuardado = localStorage.getItem('utn_user');

          showToast(`¡Bienvenido ${data.usuario.nombre}!`, 'success');
          
          //  REDIRECCI-N INMEDIATA SIN TIMEOUT
          
          // Forzar redirección inmediata
          window.location.href = destino;
          
          // Backup por si falla
          setTimeout(() => {
              if (window.location.href.includes('login.html')) {
                  window.location.replace(destino);
              }
          }, 100);
          
          
          setTimeout(() => {
              
              
              // Forzar la redirección directa
              try {
                  
                  //  VERIFICACI-N DE EMERGENCIA
                  if (!destino || destino.length === 0) {
                      const rolGuardado = localStorage.getItem('utn_user');
                      if (rolGuardado) {
                          const usuario = JSON.parse(rolGuardado);
                          const rol = usuario.rol ? usuario.rol.toLowerCase() : '';
                          
                          if (rol.includes('administrador') || rol.includes('admin')) {
                              destino = 'pages/ModAdmis.html';
                          } else {
                              destino = 'pages/ModUsuarios.html';
                          }
                      } else {
                          destino = 'pages/ModUsuarios.html'; // Default
                      }
                  }
                  
                  
                  // Redirección inmediata
                  window.location.href = destino;
                  
                  // Si no funciona en 1 segundo, forzar con replace
                  setTimeout(() => {
                      window.location.replace(destino);
                  }, 1000);
                  
              } catch (redirectError) {
                  console.error(' Error en redirección:', redirectError);
                  // Intentar método alternativo
                  window.location.replace(destino);
              }

            }, 500);

        } catch (error) {
          console.error(' Error de login:', error);
          showToast(error.message || 'Error al iniciar sesión', 'error');
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = 'ACCEDER AL SISTEMA';
        }
      }

      // Inicialización
      document.addEventListener('DOMContentLoaded', () => {
        // Enfocar en el input de usuario
        document.getElementById('userInput')?.focus();
        
        // Verificar conexión a la BD
        checkDBConnection();
        connectionCheckInterval = setInterval(checkDBConnection, CONFIG.DB_STATUS_CHECK_INTERVAL);
        
        // Manejo del formulario
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          
          const username = document.getElementById('userInput').value.trim();
          const password = document.getElementById('passInput').value;
          
          if (!username || !password) {
            showToast('Por favor complete todos los campos', 'error');
            return;
          }
          
          handleLogin({ correo_electronico: username, contrasena: password });
        });
        
        // Manejo de teclas
        document.getElementById('userInput')?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            document.getElementById('passInput')?.focus();
          }
        });
        
        document.getElementById('passInput')?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
          }
        });
      });

      // Limpiar intervalo al salir
      window.addEventListener('beforeunload', () => {
        if (connectionCheckInterval) {
          clearInterval(connectionCheckInterval);
        }
      });

      // Función para ir a la página de registro
      function goToSignUp() {
        window.location.href = 'signup.html';
      }

      async function abrirModalReactivacionBoleta(correoSugerido, cuatrimestre) {
        const { value: formValues } = await Swal.fire({
          title: '',
          html: `
            <div class="swal-boleta-wrap">
              <div class="swal-boleta-header">
                <div class="left">
                  <span class="icon">
                    <svg style="width:22px;height:22px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                  </span>
                  <div>
                    <h3>Actualiza tu boleta</h3>
                    <p>Inventario UTN - SPIEE</p>
                  </div>
                </div>
              </div>
              <div class="swal-boleta-body">
              <div class="swal-boleta-note">
                <p style="margin:0;font-size:11px;color:#1e3a5f;font-weight:700">Cuatrimestre requerido: <b style="color:#002D62">${cuatrimestre || 'ACTIVO'}</b></p>
              </div>
              <label style="display:block;font-size:9px;font-weight:800;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 5px">Cédula</label>
              <input id="swal-cedula" class="swal2-input" placeholder="Sin guiones" style="margin:0 0 8px 0;width:100%">
              <label style="display:block;font-size:9px;font-weight:800;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 5px">Correo institucional</label>
              <input id="swal-correo" class="swal2-input" placeholder="usuario@utn.ac.cr" value="${correoSugerido || ''}" style="margin:0 0 8px 0;width:100%">
              <label style="display:block;font-size:9px;font-weight:800;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 5px">Contraseña actual</label>
              <input id="swal-pass" type="password" class="swal2-input" placeholder="Tu clave actual" style="margin:0 0 10px 0;width:100%">
              <label style="display:block;font-size:9px;font-weight:800;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 5px">Boleta PDF</label>
              <div class="swal-boleta-drop">
                <input id="swal-boleta" type="file" class="swal2-file" accept=".pdf,application/pdf" style="display:none">
                <div class="swal-file-uploader">
                  <button type="button" id="swal-boleta-btn" class="swal-file-btn">Seleccionar PDF</button>
                  <div id="swal-boleta-name" class="swal-file-name">Ningún archivo seleccionado</div>
                </div>
                <p style="margin:6px 0 0 0;font-size:10px;color:#64748b">Solo formato PDF institucional.</p>
              </div>
              </div>
            </div>
          `,
          focusConfirm: false,
          confirmButtonText: 'Enviar boleta',
          confirmButtonColor: '#002D62',
          showCloseButton: true,
          showCancelButton: true,
          cancelButtonText: 'Ahora no',
          customClass: {
            popup: 'swal-boleta-popup',
            confirmButton: 'swal-boleta-confirm',
            cancelButton: 'swal-boleta-cancel',
            closeButton: 'swal-boleta-close'
          },
          didOpen: () => {
            const input = document.getElementById('swal-boleta');
            const btn = document.getElementById('swal-boleta-btn');
            const name = document.getElementById('swal-boleta-name');
            if (!input || !btn || !name) return;
            btn.addEventListener('click', () => input.click());
            input.addEventListener('change', () => {
              const file = input.files && input.files[0] ? input.files[0] : null;
              name.textContent = file ? file.name : 'Ningún archivo seleccionado';
            });
          },
          preConfirm: () => {
            const cedula = (document.getElementById('swal-cedula').value || '').trim();
            const correo = (document.getElementById('swal-correo').value || '').trim();
            const pass = document.getElementById('swal-pass').value || '';
            const boleta = document.getElementById('swal-boleta').files[0];
            if (!cedula || !correo || !pass || !boleta) {
              Swal.showValidationMessage('Complete todos los campos y adjunte el PDF.');
              return false;
            }
            if (!(boleta.name || '').toLowerCase().endsWith('.pdf')) {
              Swal.showValidationMessage('Solo se permite archivo PDF.');
              return false;
            }
            return { cedula, correo, pass, boleta };
          }
        });

        if (!formValues) return;

        try {
          const fd = new FormData();
          fd.append('cedula', formValues.cedula);
          fd.append('correo_electronico', formValues.correo);
          fd.append('contrasena', formValues.pass);
          fd.append('boleta_pdf', formValues.boleta);

          const response = await fetch(`${window.CONFIG?.API_BASE_URL || '/api'}/usuarios/boleta-reactivacion`, {
            method: 'POST',
            body: fd
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'No se pudo subir la boleta.');

          const rechazada = data?.validada === false || String(data?.estado || '').toLowerCase() === 'rechazada';
          await Swal.fire({
            icon: rechazada ? 'warning' : 'success',
            title: rechazada ? 'Boleta rechazada' : 'Boleta validada',
            text: data.message || (rechazada ? 'La boleta fue rechazada automáticamente.' : 'Boleta cargada correctamente.'),
            iconColor: rechazada ? '#C9A227' : undefined,
            confirmButtonColor: rechazada ? '#C9A227' : '#002D62'
          });
        } catch (error) {
          Swal.fire({
            icon: 'error',
            title: 'No se pudo procesar',
            text: error.message || 'Error al subir boleta.',
            confirmButtonColor: '#002D62'
          });
        }
      }
    </script>
  </body>
</html>
