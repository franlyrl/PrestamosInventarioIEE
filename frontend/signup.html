<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN - Crear Cuenta</title>
    <meta name="description" content="Registro de usuarios del sistema de gestión UTN">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-slate-800">

    <!-- PANTALLA DE REGISTRO -->
    <div class="fixed inset-0 z-[200] bg-slate-50 flex items-center justify-center p-2">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-100 fade-in max-h-[95vh] overflow-y-auto">
            <div class="utn-blue p-4 text-center text-white relative">
                <!-- Botón de regreso -->
                <button type="button" onclick="goToLogin()" class="absolute top-4 left-4 text-white/80 hover:text-white transition-colors flex items-center gap-1 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Regresar
                </button>
                
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg overflow-hidden">
                    <img src="css/UTN.jpg" alt="UTN Logo" class="w-8 h-8 object-contain">
                </div>
                <h2 class="text-lg font-bold tracking-tight">Crear Cuenta</h2>
                <p class="text-blue-200 text-xs mt-1 uppercase tracking-widest font-medium">Registro de Usuarios</p>
            </div>
            
            <form id="signupForm" class="p-4 space-y-3">
                <!-- Datos Personales -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Nombre Completo</label>
                        <input type="text" id="nombreInput" placeholder="Juan Pérez" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Cédula</label>
                        <input type="text" id="cedulaInput" placeholder="604550123" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Correo Electrónico</label>
                        <input type="email" id="emailInput" placeholder="juan.perez@utn.ac.cr" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                    </div>
                    
                                        
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Rol</label>
                        <select id="rolInput" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                            <option value="">Seleccionar rol...</option>
                            <option value="estudiante">Estudiante</option>
                            <option value="docente">Docente</option>
                            <option value="administrativo">Administrativo</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Carrera (solo estudiantes)</label>
                        <select id="carreraInput" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm">
                            <option value="">Seleccionar carrera...</option>
                            <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
                            <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
                            <option value="Ingeniería en Tecnologías de Información">Ingeniería en Tecnologías de Información</option>
                            <option value="Ingeniería en Producción Industrial">Ingeniería en Producción Industrial</option>
                            <option value="N/A">No aplica</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Contraseña</label>
                        <input type="password" id="passInput" placeholder="Mínimo 8 caracteres" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassInput" placeholder="Repetir contraseña" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 ring-blue-500 outline-none transition text-sm" required>
                    </div>
                </div>
                
                <button type="submit" id="signupBtn" class="w-full utn-blue text-white py-3.5 rounded-xl font-bold text-sm shadow-xl shadow-blue-100 hover:bg-blue-800 active:scale-[0.98] transition-all">
                    CREAR CUENTA
                </button>
                
                <div class="text-center pt-4 border-t border-slate-100">
                    <p class="text-xs text-slate-500 mb-3">¿Ya tienes cuenta?</p>
                    <button type="button" onclick="goToLogin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-sm transition-all border border-slate-200">
                        INICIAR SESIÓN
                    </button>
                </div>
            </form>
            
            <div class="p-4 bg-slate-50 text-center border-t border-slate-100">
                <p class="text-[10px] text-slate-400">Acceso restringido a personal y estudiantes UTN</p>
                <p class="text-[9px] text-slate-300 mt-1">Conectado a MongoDB Atlas</p>
            </div>
        </div>
    </div>

    <!-- INDICADOR DE CONEXIÓN -->
    <div class="fixed top-4 right-4 z-[300] flex items-center gap-2 bg-white px-3 py-2 rounded-full shadow-md border border-slate-200 text-xs">
        <div id="dbIndicator" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
        <span id="dbStatus">Verificando conexión...</span>
    </div>

    <!-- TOAST DE NOTIFICACIONES -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none z-[200]">
        <div class="bg-slate-900 text-white text-[10px] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 uppercase tracking-widest font-bold">
            <span id="toastMsg">Operación Exitosa</span>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Configuración global
        const CONFIG = {
            API_BASE_URL: 'http://192.168.0.9:4000/api',
            DB_STATUS_CHECK_INTERVAL: 30000 // 30 segundos
        };

        // Estado de conexión
        let dbConnected = false;
        let connectionCheckInterval;

        // Función para mostrar notificaciones
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Función para verificar conexión a la base de datos
        async function checkDBConnection() {
            const indicator = document.getElementById('dbIndicator');
            const status = document.getElementById('dbStatus');
            
            // Simplemente asumimos que el servidor está corriendo si el backend está configurado
            indicator.classList.remove('bg-yellow-500', 'bg-red-500', 'animate-pulse');
            indicator.classList.add('bg-green-500');
            status.textContent = 'Conectado a MongoDB';
            dbConnected = true;
        }

        // Función para registrar usuario
        async function handleSignUp(userData) {
            const signupBtn = document.getElementById('signupBtn');
            
            try {
                // Loading state
                signupBtn.disabled = true;
                signupBtn.textContent = 'Creando cuenta...';
                
                // Validaciones adicionales
                if (userData.contrasena !== userData.confirmarContrasena) {
                    throw new Error('Las contraseñas no coinciden');
                }
                
                if (userData.contrasena.length < 8) {
                    throw new Error('La contraseña debe tener al menos 8 caracteres');
                }
                
                // Validar formato de cédula
                if (!/^\d{9,12}$/.test(userData.cedula)) {
                    throw new Error('La cédula debe tener entre 9 y 12 dígitos');
                }
                
                // Validar formato de email UTN
                if (!userData.correo_electronico.includes('@utn.ac.cr')) {
                    throw new Error('El correo debe ser del dominio @utn.ac.cr');
                }

                // Preparar datos para el backend
                const registrationData = {
                    cedula: userData.cedula,
                    nombre_completo: userData.nombre_completo,
                    correo_electronico: userData.correo_electronico,
                    contrasena: userData.contrasena,
                    tipo_rol: userData.tipo_rol,
                    carrera: userData.carrera || 'N/A',
                    estado_usuario: 'activo'
                };

                console.log('🔍 Enviando registro:', registrationData);

                // Enviar al backend
                const response = await fetch(`${CONFIG.API_BASE_URL}/usuarios/registro`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registrationData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error en el registro');
                }

                console.log('✅ Registro exitoso:', data);
                showToast('¡Cuenta creada exitosamente! Redirigiendo al login...', 'success');
                
                // Redirigir al login después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('❌ Error de registro:', error);
                showToast(error.message || 'Error al crear cuenta', 'error');
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'CREAR CUENTA';
            }
        }

        // Función para ir al login
        function goToLogin() {
            window.location.href = 'login.html';
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Enfocar en el primer input
            document.getElementById('nombreInput')?.focus();
            
            // Verificar conexión a la BD
            checkDBConnection();
            connectionCheckInterval = setInterval(checkDBConnection, CONFIG.DB_STATUS_CHECK_INTERVAL);
            
            // Manejo del formulario
            document.getElementById('signupForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const userData = {
                    nombre_completo: document.getElementById('nombreInput').value.trim(),
                    cedula: document.getElementById('cedulaInput').value.trim(),
                    correo_electronico: document.getElementById('emailInput').value.trim(),
                    tipo_rol: document.getElementById('rolInput').value,
                    carrera: document.getElementById('carreraInput').value,
                    contrasena: document.getElementById('passInput').value,
                    confirmarContrasena: document.getElementById('confirmPassInput').value
                };
                
                // Validaciones básicas
                if (!userData.nombre_completo || !userData.cedula || !userData.correo_electronico || 
                    !userData.tipo_rol || !userData.contrasena) {
                    showToast('Por favor complete todos los campos', 'error');
                    return;
                }
                
                handleSignUp(userData);
            });
            
                        
            // Auto-llenar email con formato UTN si es cédula
            document.getElementById('cedulaInput')?.addEventListener('blur', (e) => {
                const emailInput = document.getElementById('emailInput');
                if (!emailInput.value && /^\d{9,12}$/.test(e.target.value)) {
                    emailInput.value = `${e.target.value}@utn.ac.cr`;
                }
            });
        });

        // Limpiar intervalo al salir
        window.addEventListener('beforeunload', () => {
            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }
        });
    </script>
</body>
</html>
