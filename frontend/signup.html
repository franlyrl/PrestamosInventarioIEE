<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN - Crear Cuenta</title>
    <meta name="description" content="Registro de usuarios del sistema de gestión UTN">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="css/UTN.jpg" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script>
      const originalWarn = console.warn;
      console.warn = function() {
        if (arguments[0] && arguments[0].includes('cdn.tailwindcss.com should not be used in production')) return;
        originalWarn.apply(console, arguments);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { utn: { blue: '#002D62', dark: '#001A33', gold: '#F2A900' } }
                }
            }
        }
    </script>

    <!-- SweetAlert2 --><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="text-slate-800 bg-slate-50 font-sans m-0 p-0 overflow-x-hidden">

    <!-- PANTALLA DE REGISTRO SPLIT SCREEN FULLSCREEN -->
    <div class="flex min-h-screen w-full bg-white fade-in relative z-10">
        
        <!-- Panel Lateral Izquierdo (Branding Institucional) -->
        <div class="hidden lg:flex flex-col justify-center items-center w-[40%] xl:w-[45%] bg-utn-blue text-white p-12 relative overflow-hidden shadow-[10px_0_30px_rgba(0,0,0,0.1)] z-20 sticky top-0 h-screen">
            <!-- Decorative element -->
            <div class="absolute top-0 right-0 -mt-20 -mr-20 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-80 h-80 bg-utn-gold opacity-10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="bg-white p-4 rounded-full mb-8 shadow-2xl z-10 transform hover:scale-105 transition-transform duration-500">
                <img src="css/UTN.jpg" alt="UTN Logo" class="w-24 h-24 object-contain">
            </div>
            <h2 class="text-3xl xl:text-4xl font-bold text-center z-10 leading-tight mb-2">Universidad Técnica Nacional</h2>
            <div class="w-16 h-1.5 bg-utn-gold my-6 z-10 rounded-full"></div>
            <p class="text-blue-100 text-lg text-center font-medium z-10 max-w-md">Registro de usuarios para el Control de Activos e Insumos</p>
            
            <div class="absolute bottom-10 z-10 text-xs text-blue-300/80 font-bold tracking-widest uppercase">
                Sede Central Académica
            </div>
        </div>

        <!-- Panel Derecho (Formulario) -->
        <div class="w-full lg:w-[60%] xl:w-[55%] flex flex-col px-8 sm:px-16 md:px-24 xl:px-32 py-12 relative min-h-screen">
            
            <div class="w-full max-w-2xl mx-auto flex flex-col justify-center h-full">
                <!-- Botón de regreso -->
                <button type="button" onclick="goToLogin()" class="text-slate-400 hover:text-utn-blue transition-colors flex items-center gap-2 text-xs font-bold uppercase tracking-widest mb-10 w-fit">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Volver al Acceso
                </button>

                <div class="mb-10">
                    <h3 class="text-4xl font-extrabold text-utn-blue mb-3 tracking-tight">Crear Cuenta</h3>
                    <p class="text-slate-500 text-base font-medium">Complete los siguientes datos personales</p>
                </div>
                
                <form id="signupForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- Columna 1 -->
                        <div class="space-y-6">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Nombre Completo</label>
                                <input type="text" id="nombreInput" placeholder="Ej. Juan Pérez" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium" required>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Cédula</label>
                                <input type="text" id="cedulaInput" placeholder="604550123" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium" required>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Correo Institucional</label>
                                <div class="relative">
                                    <input type="email" id="emailInput" placeholder="usuario@utn.ac.cr" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium" required>
                                    <div id="roleBadge" class="hidden absolute right-4 top-1/2 -translate-y-1/2 px-2 py-1 rounded text-[9px] font-black uppercase tracking-tight transition-all duration-300"></div>
                                </div>
                                <p id="roleNote" class="text-[10px] text-slate-400 mt-1.5 ml-1 font-medium italic"></p>
                            </div>
                        </div>

                        <!-- Columna 2 -->
                        <div class="space-y-6">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Carrera Institucional</label>
                                <select id="carreraInput" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium">
                                    <option value="">Seleccione carrera</option>
                                    <option value="Ingeniería Electrónica">Ing. Electrónica</option>
                                    <option value="Ingeniería Eléctrica">Ing. Eléctrica</option>
                                    <option value="Ingeniería en Tecnologías de Información">Ing. Tecnologías de Info.</option>
                                    <option value="Ingeniería en Producción Industrial">Ing. Producción Industrial</option>
                                    <option value="N/A">Otra / No aplica</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                                <input type="password" id="passInput" placeholder="Mínimo 8 caracteres" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium" required>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Confirmación</label>
                                <input type="password" id="confirmPassInput" placeholder="Confirmar contraseña" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-utn-blue/10 focus:border-utn-blue focus:bg-white outline-none transition-all text-sm text-slate-800 font-medium" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="pt-8 mt-6 flex flex-col sm:flex-row items-center justify-between gap-6 border-t border-slate-100">
                        <p class="text-xs text-slate-400 font-medium">
                            Conectado a Bases de Datos<br/>Uso Estricto UTN.
                        </p>
                        
                        <button type="submit" id="signupBtn" class="w-full sm:w-auto bg-utn-blue hover:bg-utn-dark text-white px-10 py-4 rounded-xl font-bold text-sm tracking-widest uppercase shadow-lg shadow-utn-blue/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                            <span>Formalizar Registro</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="lg:hidden text-center mt-12 mb-4 text-xs text-slate-400 font-bold tracking-widest uppercase pb-4">
                Universidad Técnica Nacional
            </div>
        </div>
    </div>

    <!-- INDICADOR DE CONEXI�N -->
    <div class="fixed top-4 right-4 z-[300] flex items-center gap-2 bg-white px-3 py-2 rounded-full shadow-md border border-slate-200 text-xs">
        <div id="dbIndicator" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
        <span id="dbStatus">Verificando conexión...</span>
    </div>

    <!-- TOAST DE NOTIFICACIONES -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none z-[200]">
        <div class="bg-slate-900 text-white text-[10px] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 uppercase tracking-widest font-bold">
            <span id="toastMsg">Operación Exitosa</span>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Configuración global - dinámica para IPs locales
        const CONFIG = {
            API_BASE_URL: `http://${window.location.hostname}:4000/api`,
            DB_STATUS_CHECK_INTERVAL: 30000 // 30 segundos
        };

        // Estado de conexión
        let dbConnected = false;
        let connectionCheckInterval;

        // Función para mostrar notificaciones
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Función para verificar conexión a la base de datos
        async function checkDBConnection() {
            const indicator = document.getElementById('dbIndicator');
            const status = document.getElementById('dbStatus');
            
            // Simplemente asumimos que el servidor está corriendo si el backend está configurado
            indicator.classList.remove('bg-yellow-500', 'bg-red-500', 'animate-pulse');
            indicator.classList.add('bg-green-500');
            status.textContent = 'Conectado a MongoDB';
            dbConnected = true;
        }

        // Función para registrar usuario
        async function handleSignUp(userData) {
            const signupBtn = document.getElementById('signupBtn');
            
            try {
                // Loading state
                signupBtn.disabled = true;
                signupBtn.textContent = 'Creando cuenta...';
                
                // Validaciones adicionales
                if (userData.contrasena !== userData.confirmarContrasena) {
                    throw new Error('Las contraseñas no coinciden');
                }
                
                if (userData.contrasena.length < 8) {
                    throw new Error('La contraseña debe tener al menos 8 caracteres');
                }
                
                // Validar formato de cédula
                if (!/^\d{9,12}$/.test(userData.cedula)) {
                    throw new Error('La cédula debe tener entre 9 y 12 dígitos');
                }
                
                // Validar formato de email UTN (ambos dominios aceptados)
                if (!userData.correo_electronico.endsWith('@utn.ac.cr') && !userData.correo_electronico.endsWith('@est.utn.ac.cr')) {
                    throw new Error('El correo debe ser del dominio @utn.ac.cr o @est.utn.ac.cr');
                }

                // Detectar rol por dominio del correo
                let rolDetectado = 'estudiante';
                if (userData.correo_electronico.endsWith('@est.utn.ac.cr')) {
                    rolDetectado = 'estudiante';
                } else if (userData.correo_electronico.endsWith('@utn.ac.cr')) {
                    rolDetectado = 'docente';
                }

                // Preparar datos para el backend
                const registrationData = {
                    cedula: userData.cedula,
                    nombre_completo: userData.nombre_completo,
                    correo_electronico: userData.correo_electronico,
                    contrasena: userData.contrasena,
                    carrera: userData.carrera || 'N/A',
                    rol: rolDetectado,
                    estado_usuario: 'activo'
                };

                console.log(' Enviando registro:', registrationData);

                // Enviar al backend
                const response = await fetch(`${CONFIG.API_BASE_URL}/usuarios/registro`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registrationData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error en el registro');
                }

                console.log(' Registro exitoso:', data);
                showToast('¡Cuenta creada exitosamente! Redirigiendo al login...', 'success');
                
                // Redirigir al login después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error(' Error de registro:', error);
                showToast(error.message || 'Error al crear cuenta', 'error');
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'CREAR CUENTA';
            }
        }

        // Función para ir al login
        function goToLogin() {
            window.location.href = 'login.html';
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Enfocar en el primer input
            document.getElementById('nombreInput')?.focus();
            
            // Verificar conexión a la BD
            checkDBConnection();
            connectionCheckInterval = setInterval(checkDBConnection, CONFIG.DB_STATUS_CHECK_INTERVAL);
            
            // Manejo del formulario
            document.getElementById('signupForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const userData = {
                    nombre_completo: document.getElementById('nombreInput').value.trim(),
                    cedula: document.getElementById('cedulaInput').value.trim(),
                    correo_electronico: document.getElementById('emailInput').value.trim(),
                    carrera: document.getElementById('carreraInput').value,
                    contrasena: document.getElementById('passInput').value,
                    confirmarContrasena: document.getElementById('confirmPassInput').value
                };
                
                // Validaciones básicas
                if (!userData.nombre_completo || !userData.cedula || !userData.correo_electronico || !userData.contrasena) {
                    showToast('Por favor complete todos los campos', 'error');
                    return;
                }
                
                handleSignUp(userData);
            });
            

            
            // Detección dinámica de rol por correo
            document.getElementById('emailInput')?.addEventListener('input', (e) => {
                const email = e.target.value.toLowerCase().trim();
                const badge = document.getElementById('roleBadge');
                const note = document.getElementById('roleNote');
                
                if (!email.includes('@utn.ac.cr')) {
                    badge.classList.add('hidden');
                    note.textContent = '';
                    return;
                }

                badge.classList.remove('hidden');
                if (email.endsWith('@est.utn.ac.cr')) {
                    badge.textContent = 'Estudiante';
                    badge.className = 'absolute right-4 top-1/2 -translate-y-1/2 px-2 py-1 rounded text-[9px] font-black uppercase tracking-tight bg-blue-100 text-blue-700';
                    note.textContent = 'Registro detectado como Estudiante (dominio @est.utn.ac.cr).';
                } else if (email.endsWith('@utn.ac.cr')) {
                    badge.textContent = 'Docente';
                    badge.className = 'absolute right-4 top-1/2 -translate-y-1/2 px-2 py-1 rounded text-[9px] font-black uppercase tracking-tight bg-indigo-100 text-indigo-700';
                    note.textContent = 'Registro detectado como Docente (dominio @utn.ac.cr).';
                }
            });

            // Auto-llenar email con formato UTN si es cédula
            document.getElementById('cedulaInput')?.addEventListener('blur', (e) => {
                const emailInput = document.getElementById('emailInput');
                if (!emailInput.value && /^\d{9,12}$/.test(e.target.value)) {
                    emailInput.value = `${e.target.value}@est.utn.ac.cr`;
                    // Disparar evento input para activar el badge
                    emailInput.dispatchEvent(new Event('input'));
                }
            });
        });

        // Limpiar intervalo al salir
        window.addEventListener('beforeunload', () => {
            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }
        });
    </script>
</body>
</html>
