<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN - Test Insumos</title>
    <meta name="description" content="Test de conexión con backend para insumos">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-slate-800 bg-slate-50">
    <!-- HEADER -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="container mx-auto px-4 py-4">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-slate-800">🧩 Test de Conexión - Insumos</h1>
                <p class="text-slate-600">Verificando conexión con el backend</p>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mx-auto px-4 py-6">
        <!-- PANEL DE CONTROL -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-xl font-semibold text-slate-800">Panel de Prueba</h2>
                    <p class="text-sm text-slate-600">Verificando conexión con API de insumos</p>
                </div>
                
                <!-- Botones de acción -->
                <div class="flex gap-3">
                    <button onclick="testConexion()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                        🔍 Test Conexión
                    </button>
                    
                    <button onclick="cargarInsumos()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                        📦 Cargar Insumos
                    </button>
                </div>
            </div>

            <!-- Estado de conexión -->
            <div class="mb-6 p-4 rounded-lg" id="estadoConexion">
                <div class="flex items-center gap-3">
                    <div id="indicadorConexion" class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <span id="textoConexion" class="text-sm font-medium">Verificando conexión...</span>
                </div>
            </div>

            <!-- TABLA DE INSUMOS -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="px-6 py-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-slate-800">Insumos Disponibles</h3>
                        <span class="text-sm text-slate-600" id="totalInsumos">Total: 0 insumos</span>
                    </div>
                    
                    <!-- Tabla responsive -->
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nombre</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Categoría</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Stock</th>
                                </tr>
                            </thead>
                            <tbody id="tablaInsumos" class="bg-white divide-y divide-slate-200">
                                <!-- Los insumos se cargarán aquí dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- TOAST DE NOTIFICACIONES -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none z-[200]">
        <div class="bg-slate-900 text-white text-[10px] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 uppercase tracking-widest font-bold">
            <span id="toastMsg">Operación Exitosa</span>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
    
    <script>
        // CONFIGURACIÓN
        const API_BASE_URL = 'http://localhost:4000/api';
        
        // Función para mostrar notificaciones
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
        
        // Test de conexión básico
        async function testConexion() {
            try {
                console.log('🔍 Probando conexión con el backend...');
                
                const response = await fetch(`${API_BASE_URL}/insumos`);
                console.log('📊 Respuesta:', response.status, response.statusText);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Conexión exitosa:', data);
                    
                    // Actualizar UI
                    document.getElementById('indicadorConexion').className = 'w-3 h-3 rounded-full bg-green-500';
                    document.getElementById('textoConexion').textContent = 'Conexión exitosa';
                    document.getElementById('estadoConexion').className = 'mb-6 p-4 rounded-lg bg-green-50 border border-green-200';
                    
                    showToast('✅ Conexión exitosa con el backend', 'success');
                    
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
            } catch (error) {
                console.error('❌ Error de conexión:', error);
                
                // Actualizar UI
                document.getElementById('indicadorConexion').className = 'w-3 h-3 rounded-full bg-red-500';
                document.getElementById('textoConexion').textContent = 'Error de conexión';
                document.getElementById('estadoConexion').className = 'mb-6 p-4 rounded-lg bg-red-50 border border-red-200';
                
                showToast('❌ Error de conexión con el backend', 'error');
            }
        }
        
        // Cargar insumos
        async function cargarInsumos() {
            try {
                console.log('📦 Cargando insumos...');
                
                // Primero probar autenticación
                const token = localStorage.getItem('utn_token');
                console.log('🔑 Token encontrado:', token ? 'Sí' : 'No');
                
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                // Agregar token si existe
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch(`${API_BASE_URL}/insumos`, {
                    method: 'GET',
                    headers: headers
                });
                
                console.log('📊 Respuesta insumos:', response.status, response.statusText);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Insumos cargados:', data);
                    
                    mostrarInsumos(data);
                    showToast(`✅ Se cargaron ${data.length} insumos`, 'success');
                    
                } else {
                    const errorData = await response.json();
                    console.error('❌ Error cargando insumos:', errorData);
                    showToast(`❌ Error: ${errorData.message || 'Error desconocido'}`, 'error');
                }
                
            } catch (error) {
                console.error('❌ Error en cargarInsumos:', error);
                showToast('❌ Error de conexión al cargar insumos', 'error');
            }
        }
        
        // Mostrar insumos en la tabla
        function mostrarInsumos(insumos) {
            const tbody = document.getElementById('tablaInsumos');
            const totalSpan = document.getElementById('totalInsumos');
            
            tbody.innerHTML = '';
            
            if (insumos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-8 text-center text-slate-600">
                            <div class="flex flex-col items-center">
                                <svg class="w-12 h-12 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4m16 0l-4 4m0 0l4-4m0 0H4m16 0l4-4m0 0z"/>
                                </svg>
                                <p class="font-medium">No hay insumos disponibles</p>
                                <p class="text-sm text-slate-500">Agrega algunos insumos al inventario</p>
                            </div>
                        </td>
                    </tr>
                `;
                totalSpan.textContent = 'Total: 0 insumos';
                return;
            }
            
            insumos.forEach(insumo => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition-colors';
                
                // Determinar clase de stock
                let stockClass = 'text-green-600';
                let stockText = 'Disponible';
                if (insumo.stock_actual <= insumo.stock_minimo) {
                    stockClass = 'text-red-600';
                    stockText = 'Stock Bajo';
                }
                
                row.innerHTML = `
                    <td class="px-6 py-4 text-sm font-medium text-slate-900">${insumo._id || insumo.id}</td>
                    <td class="px-6 py-4 text-sm">${insumo.nombre_insumo || insumo.nombre || 'Sin nombre'}</td>
                    <td class="px-6 py-4 text-sm">${insumo.categoria || 'Sin categoría'}</td>
                    <td class="px-6 py-4 text-sm font-medium ${stockClass}">${insumo.stock_actual || insumo.stock || 0}</td>
                `;
                
                tbody.appendChild(row);
            });
            
            totalSpan.textContent = `Total: ${insumos.length} insumos`;
        }
        
        // Probar conexión automáticamente al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Página de test cargada');
            setTimeout(testConexion, 1000);
        });
    </script>
</body>
</html>
