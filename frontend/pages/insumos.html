<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumos - UTN Sistema de Gestión</title>
    <meta name="description" content="Gestión de insumos del laboratorio UTN">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/insumos.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-slate-800">
    
    <!-- Header Component -->
    <div id="header-component"></div>
    
    <!-- Contenido Principal -->
    <main class="container py-6">
        <div class="flex gap-6">
            <!-- Sidebar Component -->
            <div id="sidebar-component"></div>
            
            <!-- Contenido de Insumos -->
            <div class="flex-1">
                <header class="mb-6">
                    <h1 class="text-3xl font-bold text-slate-800">📦 Gestión de Insumos</h1>
                    <p class="text-slate-600">Administra los materiales y consumibles del laboratorio</p>
                </header>
                
                <!-- Filtros y Búsqueda -->
                <section class="card p-4 mb-6">
                    <div class="flex flex-wrap gap-4 items-center">
                        <div class="flex-1 min-w-[200px]">
                            <input type="text" id="busqueda-input" placeholder="Buscar insumos..." class="input-field w-full">
                        </div>
                        <select id="categoria-select" class="input-field w-48">
                            <option value="todas">Todas las categorías</option>
                            <option value="Componentes Analógicos">Componentes Analógicos</option>
                            <option value="Componentes Digitales">Componentes Digitales</option>
                            <option value="Herramientas Menores">Herramientas Menores</option>
                            <option value="Consumibles de Soldadura">Consumibles de Soldadura</option>
                            <option value="Otros">Otros</option>
                        </select>
                        <select id="stock-select" class="input-field w-32">
                            <option value="todos">Todos</option>
                            <option value="con-stock">Con Stock</option>
                            <option value="sin-stock">Sin Stock</option>
                            <option value="bajo-stock">Bajo Stock</option>
                        </select>
                        <button id="buscar-btn" class="btn btn-primary">
                            🔍 Buscar
                        </button>
                        <button id="limpiar-btn" class="btn btn-secondary">
                            🔄 Limpiar
                        </button>
                    </div>
                </section>
                
                <!-- Acciones Rápidas -->
                <section class="flex justify-between items-center mb-6">
                    <div class="flex gap-2">
                        <button id="agregar-btn" class="btn btn-primary">
                            ➕ Agregar Insumo
                        </button>
                        <button id="agregar-masivo-btn" class="btn btn-secondary">
                            📦 Agregar Masivo
                        </button>
                        <button id="exportar-btn" class="btn btn-secondary">
                            📥 Exportar
                        </button>
                    </div>
                    <div class="text-sm text-slate-600">
                        Mostrando <span id="resultados-count">0</span> resultados
                    </div>
                </section>
                
                <!-- Grid de Insumos -->
                <section id="insumos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Los insumos se cargarán dinámicamente -->
                </section>
                
                <!-- Loading State -->
                <div id="loading-state" class="hidden">
                    <div class="flex justify-center items-center py-12">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                        <p class="ml-4 text-slate-600">Cargando insumos...</p>
                    </div>
                </div>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden">
                    <div class="text-center py-12">
                        <div class="text-6xl mb-4">📦</div>
                        <h3 class="text-xl font-bold text-slate-700 mb-2">No se encontraron insumos</h3>
                        <p class="text-slate-500 mb-4">Intenta ajustar los filtros o agrega nuevos insumos</p>
                        <div class="flex gap-2 justify-center">
                            <button class="btn btn-primary" onclick="insumosController.showAgregarModal()">
                                ➕ Agregar Primer Insumo
                            </button>
                            <button class="btn btn-secondary" onclick="insumosController.showMasivoModal()">
                                📦 Agregar Masivo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Modals Component -->
    <div id="modals-component"></div>
    
    <!-- Toast Component -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none z-[200]">
        <div class="bg-slate-900 text-white text-[10px] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 uppercase tracking-widest font-bold">
            <span id="toastMsg">Operación Exitosa</span>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="../js/main.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/modals.js"></script>
    <script src="../js/pages/insumos.js"></script>
    
    <!-- Carga del Header Component -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Cargar header component
            try {
                const headerResponse = await fetch('../components/header.html');
                const headerHtml = await headerResponse.text();
                document.getElementById('header-component').innerHTML = headerHtml;
                console.log('✅ Header component cargado en insumos.html');
                
                // Actualizar información del usuario
                const userData = localStorage.getItem('utn_user');
                if (userData) {
                    const currentUser = JSON.parse(userData);
                    const userInfo = document.getElementById('userInfo');
                    const userMenuName = document.getElementById('userMenuName');
                    const dropdownUserName = document.getElementById('dropdownUserName');
                    const dropdownUserRole = document.getElementById('dropdownUserRole');
                    
                    const nombreCompleto = currentUser.nombre_completo || currentUser.nombre || 'Usuario';
                    
                    if (userInfo) userInfo.textContent = nombreCompleto;
                    if (userMenuName) userMenuName.textContent = nombreCompleto;
                    if (dropdownUserName) dropdownUserName.textContent = nombreCompleto;
                    if (dropdownUserRole) dropdownUserRole.textContent = currentUser.rol || 'Estudiante';
                }
                
                // Configurar logout
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        localStorage.removeItem('utn_token');
                        localStorage.removeItem('utn_user');
                        window.location.href = '../index.html';
                    });
                }
                
                // Configurar menú usuario
                const userMenuBtn = document.getElementById('user-menu-btn');
                const userDropdown = document.getElementById('user-dropdown');
                if (userMenuBtn && userDropdown) {
                    userMenuBtn.addEventListener('click', () => {
                        userDropdown.classList.toggle('hidden');
                    });
                    
                    // Cerrar al hacer click fuera
                    document.addEventListener('click', (e) => {
                        if (!userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
                            userDropdown.classList.add('hidden');
                        }
                    });
                }
                
            } catch (error) {
                console.error('❌ Error cargando header component:', error);
            }
        });
    </script>
    
    <!-- Inicialización -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Iniciando insumos.html...');
            
            // Verificar autenticación usando la misma lógica que index.html
            const token = localStorage.getItem('utn_token');
            const userData = localStorage.getItem('utn_user');
            
            console.log('🔍 Verificando sesión en insumos.html:', {
                token: token ? 'existe' : 'no existe',
                usuario: userData ? 'existe' : 'no existe'
            });
            
            if (!token || !userData) {
                console.log('🚫 No hay sesión en insumos.html, redirigiendo a ../index.html...');
                window.location.href = '../index.html';
                return;
            }
            
            console.log('✅ Sesión válida en insumos.html, inicializando...');
            
            // Inicializar página de insumos
            window.insumosController?.initialize();
        });
    </script>
</body>
</html>
