<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - UTN Sistema de Gestión</title>
    <meta name="description" content="Historial de solicitudes del laboratorio UTN">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 --><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="text-utn-dark">
    <div class="container py-6">
        <header class="mb-8 bg-gradient-to-r from-[#002e6e] via-[#004a8c] to-[#0066cc] rounded-2xl p-6 text-white shadow-xl">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold mb-2 flex items-center gap-3">
                         Historial de Solicitudes
                    </h1>
                    <p class="text-blue-100 text-lg">
                        Consulta y gestiona todas las solicitudes del laboratorio
                    </p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-bold" id="total-solicitudes">0</div>
                    <div class="text-blue-100 text-sm">Total Solicitudes</div>
                </div>
            </div>
        </header>
        
        <main class="bg-white rounded-xl shadow-lg p-6">
            <div class="text-center py-12">
                <div class="text-6xl mb-4"></div>
                <h3 class="text-xl font-bold text-slate-700 mb-2">Cargando solicitudes...</h3>
                <p class="text-slate-500">Por favor espera un momento.</p>
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mt-4"></div>
            </div>
        </main>
    </div>

    <script>
        console.log(' Página de solicitudes simple cargada');
        
        // Verificar autenticación
        const token = localStorage.getItem('utn_token');
        const userData = localStorage.getItem('utn_user');
        
        if (!token || !userData) {
            console.log(' No hay token o usuario, redirigiendo a login...');
            window.location.href = '../login.html';
        } else {
            console.log(' Token y usuario encontrados');
            
            // Cargar solicitudes (simulado por ahora)
            setTimeout(() => {
                const totalElement = document.getElementById('total-solicitudes');
                if (totalElement) {
                    totalElement.textContent = '5'; // Dato de ejemplo
                }
            }, 1000);
        }
    </script>
</body>
</html>
