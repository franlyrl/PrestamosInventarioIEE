<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - UTN SPIEE</title>
    <meta name="description" content="Historial de solicitudes del laboratorio UTN">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/solicitudes.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { utn: { blue: '#002D62', dark: '#001A33', gold: '#F2A900' } } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .field-label { display: block; font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
        .field-input { width: 100%; padding: 6px 10px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 12px; font-weight: 500; color: #1e293b; transition: all 0.2s; outline: none; }
        .field-input:focus { border-color: #002D62; box-shadow: 0 0 0 3px rgba(0,45,98,0.08); background: white; }
        .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; }
    </style>


    <!-- SweetAlert2 --><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Flatpickr (Elegant Date/Time Picker) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">
    
    <!-- NAV: Header Component -->
    <div id="header-component"></div>
    
    <!-- Encabezado de Página Institucional -->
    <div class="bg-white border-b border-slate-200 px-6 py-5">
        <div class="container mx-auto max-w-6xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <button type="button" onclick="window.redirigirInicio()" class="group flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-[#002D62] text-slate-500 hover:text-white rounded-lg text-[11px] font-black tracking-wide transition-all duration-200 border border-slate-200 hover:border-[#002D62]">
                        <svg class="w-3.5 h-3.5 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                        VOLVER AL PANEL
                    </button>
                    <span class="text-slate-300">/</span>
                    <span class="w-2 h-2 rounded-full bg-[#F2A900] inline-block"></span>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Gestión</span>
                </div>
                <h1 class="text-2xl font-black text-[#002D62]">Historial de Solicitudes</h1>
                <p class="text-sm text-slate-500 mt-0.5">Préstamos y consumibles del laboratorio</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total:</span>
                <span id="total-solicitudes" class="text-2xl font-black text-[#002D62]">0</span>
            </div>
        </div>
    </div>
    
    <!-- Contenido Principal -->
    <main class="container mx-auto max-w-6xl px-6 py-8 flex-grow">
        <div>
            
            <div>
                
                <!-- KPIs de Estado -->
                <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-7">
                    <div class="card p-4 text-center">
                        <div class="w-2 h-2 rounded-full bg-yellow-400 mx-auto mb-2"></div>
                        <div class="text-2xl font-black text-slate-700" id="pendientes-count">0</div>
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Pendientes</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="w-2 h-2 rounded-full bg-green-500 mx-auto mb-2"></div>
                        <div class="text-2xl font-black text-slate-700" id="aprobadas-count">0</div>
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Aprobadas</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="w-2 h-2 rounded-full bg-blue-500 mx-auto mb-2"></div>
                        <div class="text-2xl font-black text-slate-700" id="entregadas-count">0</div>
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Entregadas</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="w-2 h-2 rounded-full bg-red-500 mx-auto mb-2"></div>
                        <div class="text-2xl font-black text-slate-700" id="rechazadas-count">0</div>
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Rechazadas</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="w-2 h-2 rounded-full bg-slate-400 mx-auto mb-2"></div>
                        <div class="text-2xl font-black text-slate-700" id="canceladas-count">0</div>
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Canceladas</div>
                    </div>
                </div>
                
                <!-- Panel de Filtros -->
                <div class="card p-4 mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3">Filtros de Búsqueda</h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-2 items-end">
                        <div>
                            <label class="field-label">Búsqueda por Nombre / ID</label>
                            <input type="text" id="busqueda" placeholder="Nombre, ID solicitud..." class="field-input">
                        </div>
                        <!-- K: Campo de búsqueda por cédula - solo visible para admin (via JS aggrega class hidden para estudiantes) -->
                        <div id="filtro-cedula-wrapper">
                            <label class="field-label">Búsqueda por Cédula</label>
                            <input type="text" id="cedula-filter" placeholder="Ej. 604550123" class="field-input" maxlength="12">
                        </div>
                        <div>
                            <label class="field-label">Estado</label>
                            <select id="estado-filter" class="field-input">
                                <option value="todos">Todos los estados</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="aprobada">Aprobada</option>
                                <option value="entregado">Entregado</option>
                                <option value="devuelto">Devuelto</option>
                                <option value="rechazada">Rechazada</option>
                                <option value="cancelada">Cancelada</option>
                                <option value="penalizado">Penalizado</option>
                            </select>
                        </div>
                        <div id="filtro-usuario-wrapper">
                            <label class="field-label">Usuario</label>
                            <select id="usuario-filter" class="field-input">
                                <option value="todos">Todos los usuarios</option>
                                <!-- Se poblará dinámicamente -->
                            </select>
                        </div>
                        <div>
                            <label class="field-label">Desde</label>
                            <input type="date" id="fecha-desde" class="field-input">
                        </div>
                        <div>
                            <label class="field-label">Hasta</label>
                            <input type="date" id="fecha-hasta" class="field-input">
                        </div>
                        <div>
                            <button id="btn-refrescar" class="w-full py-[6px] px-3 bg-[#002D62] text-white rounded-[8px] font-bold text-xs hover:bg-[#001A33] transition flex items-center justify-center gap-2">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Refrescar
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Tabla de Solicitudes (Desktop) -->
                <div class="hidden lg:block card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200">
                                <tr>
                                    <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">ID</th>
                                    <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Usuario</th>
                                    <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Elementos</th>
                                    <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Fecha</th>
                                    <th class="px-5 py-4 text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">Estado</th>
                                    <th class="px-5 py-4 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="solicitudes-tbody-desktop" class="divide-y divide-slate-50">
                                <!-- Dinámico -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Vista Móvil -->
                <section id="mobile-solicitudes-container" class="lg:hidden space-y-4">
                    <!-- Dinámico -->
                </section>
                
                <!-- Loading State -->
                <div id="loading-state" class="hidden py-20 text-center">
                    <div class="w-10 h-10 border-4 border-slate-200 border-t-[#002D62] rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-sm text-slate-500 font-medium">Buscando en los registros...</p>
                </div>
            </div>
        </div>

        <!-- Paginación — fuera de la tarjeta para no ser cortada por overflow -->
        <div id="paginacion-solicitudes" class="mt-4"></div>
    </main>


    <!-- Modals Component -->
    <div id="modals-component"></div>
    
    <!-- FOOTER COMPONENT -->
    <div id="footer-component"></div>

    <!-- JavaScript Principal -->
    <script src="../js/app.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/Solicitudes/solicitudes.js"></script>
</body>
</html>
